<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .wrap{
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: rgb(225, 225, 165);
        }
        .box{
            display: flex;
            width: 400px;
            height: 400px;
            background-color: #d1b2cb;
            flex-direction: column;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            }
        .box1{
            width: 100px;
            height: 100px;
            background-color: rgb(75, 212, 189);
            /* 缩小 */
            /* flex-shrink: ; 默认所有人的flex-shrink：1;*/
            /* 放大 */
            /* flex-grow: ; 写了该样式的项目会按照flex-grow的值占比 去占容器的主轴方向的剩余空间*/
            /* align-self: flex-start; */
            /* order: 2; */
        }
        .box2{
            width: 100px;
            height: 100px;
            background-color: rgb(87, 174, 228);
        }

        /* 容器 */
        /* display: flax;
        1.容器内的所有项目默认按照 主轴线方向排列 
        默认容器的轴线方向主轴是横轴 左->右   交叉轴 上->下 */
        /* 2. 默认项目不允许超出容器，不能换行，超出部分会自动缩放 */
        /* 项目 */
        /* 1.项目都会变成块元素 */
        /* 2.项目不设置高度，默认和容器的交叉轴大小一致 */

        
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
    </div>
</body>
</html>
